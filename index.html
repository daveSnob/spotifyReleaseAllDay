<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Release Radar</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; max-width: 600px; margin: auto; }
        h1 { color: #1db954; font-size: 24px; }
        button { width: 100%; padding: 14px 20px; font-size: 16px; border-radius: 30px; box-sizing: border-box; margin-top: 15px; background-color: #1db954; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background-color: #1aa34a; }
        #log { background: #181818; padding: 15px; border-radius: 8px; margin-top: 20px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #282828; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Daily Release Radar 🎧</h1>
    <p>Genera il tuo Release Radar giornaliero.</p>

    <!-- Sezione Login -->
    <div id="login-section">
        <button id="login-btn">Accedi con Spotify</button>
    </div>

    <!-- Sezione App principale -->
    <div id="app-section" class="hidden">
        <button id="generate-btn">Cerca Uscite e Aggiorna Playlist</button>
    </div>

    <div id="log">Pronto. Clicca su accedi per iniziare...</div>

    <script>
        const CLIENT_ID = "e03d270b21e645a59c6385ea8c9108bb"; 
        const REDIRECT_URI = "https://davesnob.github.io/spotifyReleaseAllDay/";
        const SCOPES = "user-follow-read playlist-modify-private playlist-modify-public";

        const logEl = document.getElementById('log');
        function log(text) {
            logEl.innerHTML += `<br>` + text;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function generateRandomString(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, [...new Uint8Array(digest)]))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        document.getElementById('login-btn').addEventListener('click', async () => {
            const codeVerifier = generateRandomString(128);
            localStorage.setItem('code_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);

            const args = new URLSearchParams({
                response_type: 'code',
                client_id: CLIENT_ID,
                scope: SCOPES,
                redirect_uri: REDIRECT_URI,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge
            });

            window.location = 'https://accounts.spotify.com/authorize?' + args.toString();
        });

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                log("Autenticazione riuscita! Ottengo il token...");
                await exchangeCodeForToken(code);
                window.history.replaceState({}, document.title, REDIRECT_URI);
            } else if (localStorage.getItem('access_token')) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                log("Sessione attiva trovata.");
            }
        });

        async function exchangeCodeForToken(code) {
            const codeVerifier = localStorage.getItem('code_verifier');
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: CLIENT_ID,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: codeVerifier,
                }),
            });

            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('access_token', data.access_token);
                log("Token salvato con successo!");
            } else {
                log("Errore nel recupero del token: " + JSON.stringify(data));
            }
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            let token = localStorage.getItem('access_token');
            const options = {
                method: method,
                headers: { 'Authorization': 'Bearer ' + token }
            };
            if (body) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
            const res = await fetch('https://api.spotify.com/v1' + endpoint, options);
            if (res.status === 204) return null;
            return await res.json();
        }

        document.getElementById('generate-btn').addEventListener('click', async () => {
            log("Inizio scansione artisti seguiti...");
            try {
                let artists = [];
                let url = '/me/following?type=artist&limit=50';
                
                while (url) {
                    const data = await apiCall(url.replace('https://api.spotify.com/v1', ''));
                    if (data && data.artists && data.artists.items) {
                        artists.push(...data.artists.items);
                        url = data.artists.next;
                    } else {
                        break;
                    }
                }
                log(`Trovati ${artists.length} artisti seguiti. Controllo uscite...`);

                let newTracks = [];
                const today = new Date();

                for (let artist of artists) {
                    const albumsData = await apiCall(`/artists/${artist.id}/albums?include_groups=album,single&limit=3`);
                    if (albumsData && albumsData.items) {
                        for (let album of albumsData.items) {
                            if (album.release_date_precision === 'day') {
                                const releaseDate = new Date(album.release_date);
                                const diffTime = Math.abs(today - releaseDate);
                                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                                if (diffDays <= 2) {
                                    const tracksData = await apiCall(`/albums/${album.id}/tracks`);
                                    if (tracksData && tracksData.items) {
                                        for (let track of tracksData.items) {
                                            newTracks.push(track.uri);
                                            log(`✨ Nuovo: <b>${track.name}</b> (${artist.name})`);
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

                if (newTracks.length === 0) {
                    log("Nessuna nuova uscita trovata nelle ultime 48 ore.");
                    return;
                }

                log("Cerco la playlist 'Daily Release Radar'...");
                const user = await apiCall('/me');
                const playlists = await apiCall('/me/playlists?limit=50');
                let playlistId = null;

                if (playlists && playlists.items) {
                    for (let pl of playlists.items) {
                        if (pl.name === 'Daily Release Radar') {
                            playlistId = pl.id;
                            break;
                        }
                    }
                }

                if (!playlistId && user) {
                    log("Creo la playlist 'Daily Release Radar'...");
                    const newPl = await apiCall(`/users/${user.id}/playlists`, 'POST', {
                        name: 'Daily Release Radar',
                        public: false,
                        description: 'Aggiornato giornalmente via Web App personalizzata.'
                    });
                    if (newPl) playlistId = newPl.id;
                }

                if (playlistId) {
                    const tracksToAdd = [...new Set(newTracks)].slice(0, 100);
                    await apiCall(`/playlists/${playlistId}/tracks`, 'PUT', {
                        uris: tracksToAdd
                    });
                    log(`🎉 Fatto! Aggiunti ${tracksToAdd.length} brani alla playlist.`);
                }

            } catch (err) {
                log("Errore: " + err.message);
                console.error(err);
            }
        });
    </script>
</body>
</html>
